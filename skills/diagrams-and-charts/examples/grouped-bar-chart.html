<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/skill/claude-style/style.css" />
  </head>
  <body>
    <div class="canvas" id="diagram"></div>
    <script type="module">
      import { barChart } from '/skill/charts.ts'
      const s = (v) => `${v} s`
      const min = (v) => `${v} min`
      barChart('#diagram', {
        series: ['git', 'scn'],
        ratioHeader: 'Faster',
        axisTitle: 'Median time',
        charts: [
          {
            title: 'Developer environments',
            legend: true,
            max: 100,
            ticks: [0, 20, 40, 60, 80, 100],
            unit: s,
            rows: [
              { label: 'Pull latest', values: [87, 3.5], text: ['87 s', '3.5 s'], ratio: '×25' },
              { label: 'Checkout', values: [15, 1.1], text: ['15 s', '1.1 s'], ratio: '×14' },
              { label: 'Rebase', values: [13, 2.7], text: ['13 s', '2.7 s'], ratio: '×4.8' },
            ],
          },
          {
            max: 4,
            ticks: [0, 1, 2, 3, 4],
            unit: s,
            rows: [
              { label: 'Status', values: [3.9, 0.019], text: ['3.9 s', '19 ms'], ratio: '×207' },
              { label: 'Commit', values: [1.4, 1.1], text: ['1.4 s', '1.1 s'], ratio: '×1.3' },
              { label: 'Diff', values: [0.407, 0.067], text: ['407 ms', '67 ms'], ratio: '×6.1' },
            ],
          },
          {
            title: 'Agent environments',
            max: 8,
            ticks: [0, 2, 4, 6, 8],
            unit: min,
            rows: [
              { label: 'New worktree', values: [7.1, 5.1 / 60], text: ['7.1 min', '5.1 s'], ratio: '×84' },
              { label: 'Pull latest', values: [3, 9 / 60], text: ['3.0 min', '9.0 s'], ratio: '×20' },
              { label: 'Commit', values: [18 / 60, 0.761 / 60], text: ['18 s', '761 ms'], ratio: '×24' },
              { label: 'Status', values: [4.3 / 60, 0], text: ['4.3 s', '<0.2 s'], ratio: '×20+' },
            ],
          },
          {
            title: 'Total source control time per change request',
            max: 40,
            ticks: [0, 10, 20, 30, 40],
            unit: min,
            rows: [
              { label: 'Agent environments', values: [34, 3.7], text: ['34 min', '3.7 min'], ratio: '×9.2', note: '≈11,000 agent hours a day' },
            ],
          },
          {
            title: 'CI and compute jobs',
            max: 200,
            ticks: [0, 50, 100, 150, 200],
            unit: s,
            rows: [
              { label: 'Checkout at start of compute job', values: [175, 22], text: ['175 s', '22 s'], ratio: '×8.0', note: '≈85,000 machine hours a day' },
              { label: 'Checkout in a CI job', values: [31, 3.5], text: ['31 s', '3.5 s'], ratio: '×8.8', note: '≈195,000 machine hours a day' },
            ],
          },
        ],
      })
    </script>
  </body>
</html>
